<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="description" content="Product review form page for submitting product ratings and detailed user feedback.">
    <meta name="author" content="Rich Kevin Panozo Vargas">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles/form.css">
    <!-- JavaScript -->
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review Form</h1>
    </header>

    <main>
        <form method="get" action="review.html">
            <!-- Product Name -->
            <div class="form-item">
                <label for="product">Product Name <span class="required">*</span></label>
                <select id="product" name="product" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <!-- Overall Rating -->
            <fieldset class="form-item">
                <legend>Overall Rating <span class="required">*</span></legend>
                <div class="rating">
                    <input type="radio" id="star5" name="rating" value="5" required>
                    <label for="star5" title="5 stars">&#9733;</label>

                    <input type="radio" id="star4" name="rating" value="4" required>
                    <label for="star4" title="4 stars">&#9733;</label>

                    <input type="radio" id="star3" name="rating" value="3" required>
                    <label for="star3" title="3 stars">&#9733;</label>

                    <input type="radio" id="star2" name="rating" value="2" required>
                    <label for="star2" title="2 stars">&#9733;</label>

                    <input type="radio" id="star1" name="rating" value="1" required>
                    <label for="star1" title="1 star">&#9733;</label>
                </div>
            </fieldset>

            <!-- Date of Installation -->
            <div class="form-item">
                <label for="installation-date">Date of Installation <span class="required">*</span></label>
                <input type="date" id="installation-date" name="installation-date" required>
            </div>

            <!-- Useful Features -->
            <fieldset class="form-item">
                <legend>Useful Features (Check all that apply)</legend>
                <div class="checkbox-group">
                    <label><input type="checkbox" id="durability" name="features" value="durability"> Durability</label>
                    <label><input type="checkbox" id="ease-of-use" name="features" value="ease-of-use"> Ease of Use</label>
                    <label><input type="checkbox" id="performance" name="features" value="performance"> Performance</label>
                    <label><input type="checkbox" id="design" name="features" value="design"> Design</label>
                </div>
            </fieldset>

            <!-- Written Review -->
            <div class="form-item">
                <label for="review">Written Review (Optional)</label>
                <textarea id="review" name="review" rows="5" placeholder="Share your experience with the product..."></textarea>
            </div>

            <!-- User Name -->
            <div class="form-item">
                <label for="username">Your Name (Optional)</label>
                <input type="text" id="username" name="username" placeholder="e.g. Kevin Vargas">
            </div>

            <!-- Submit Button -->
            <div class="form-item">
                <input type="submit" value="Post Review" class="submit-btn">
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | Rich Kevin Panozo Vargas | Bolivia</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
